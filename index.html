<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayCanvas Engine - Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, sans-serif;
        }
        #app {
            text-align: center;
            color: #eee;
        }
        canvas {
            border: 2px solid #4a4a6a;
            border-radius: 8px;
            display: block;
            margin: 20px auto;
        }
        h1 { color: #7c3aed; margin-bottom: 10px; }
        p { color: #888; margin-bottom: 20px; }
        #info {
            margin-top: 20px;
            padding: 15px;
            background: #2a2a4e;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="app">
        <h1>PlayCanvas Engine</h1>
        <p>WebGL2/WebGPU Hybrid Engine with Unity-like API</p>
        <canvas id="canvas" width="800" height="600"></canvas>
        <div id="info">Loading...</div>
    </div>
    <script type="module" src="/examples/main.ts"></script>
</body>
</html>
